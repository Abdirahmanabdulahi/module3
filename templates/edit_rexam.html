{% extends 'base.html' %}

{% block title %}Edit Exam{% endblock %}

{% block content %}     
            <div class="row">
                <div class="col-md-12">
                    <div class="box box-primary">
                        <div class="box-header with-border">
                            <h3 class="box-title"><i class="fa fa-edit"></i> Edit Student Result</h3>
                        </div>
                        <form id="form1" action="{{ url_for('edit_result', id=result.id) }}" method="post" accept-charset="utf-8">
                            <div class="box-body">                        
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="student_id">Student ID</label><small class="req"> *</small>
                                            <input type="text" class="form-control" id="student_id" name="student_id" value="{{result.student_id}}" readonly>
                                            <span class="text-danger"></span>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="subject_id">Subject Name</label><small class="req"> *</small>
                                            <select name="subject_id" id="subject_id" class="form-control" required>
                                                {% for subject in subjects %}
                                                    <option value="{{subject.subject_id}}" {% if subject.subject_id == result.subject_id %} selected {% endif %}>{{subject.subject_name}}</option>    
                                                {% endfor %}
                                            </select>
                                            <span class="text-danger"></span>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="exam_id">Exam Name</label><small class="req"> *</small>           
                                            <select name="exam_id" id="exam_id" class="form-control" required>
                                                {% for exam in exams %}
                                                    <option value="{{exam.exam_id}}" {% if exam.exam_id == result.exam_id %} selected {% endif %}>{{exam.exam_name}}</option>    
                                                {% endfor %}
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="marks">Marks</label><small class="req"> *</small>
                                            <input type="number" class="form-control" id="marks" name="marks" step="0.01" value="{{result.marks}}" required>
                                            <span class="text-danger"></span>
                                        </div>
                                    </div>                                         
                                </div>
                            </div>
                            <div class="box-footer">
                                <button type="submit" class="btn btn-primary btn-sm"><i class="fa fa-save"></i> Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            {% endblock %}
