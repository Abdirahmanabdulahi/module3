{% extends 'base.html' %}

{% block title %}Section Management{% endblock %}

{% block content %}     
		 	
				<div class="row">
				<a href="#"><strong><span class="ti-crown"></span> Edit Sections</strong></a>
				<hr>
				{% for section in sections %}
					<form method="post" id="sectionForm" action="{{ url_for('save_sections')}}">
						<div class="modal-body">
							<div class="form-group">
								<label for="section_name" class="control-label">Section Name*</label>
								<input type="text" class="form-control" id="section_name" name="section_name" placeholder="Section Name" value="{{section.section}}" required>							
							</div>									
						</div>
						<div class="modal-footer">
							<input type="hidden" name="sectionid" id="sectionid" value="{{section.section_id}}"/>
							<input type="hidden" name="action" id="action" value="updateSection" />
							<button type="submit" name="save" id="save" class="btn btn-info"><i title="Update Section" class="fa fa-pencil-square" aria-hidden="true"></i></button>
							<button type="submit" class="btn btn-danger" data-dismiss="modal">
                                <i class="fa fa-window-close" aria-hidden="true" title="Close this form"></i> 
                            </button>
							
						</div>				
					</form>
				{% endfor %}						
				</div>	
	
	{% endblock  %}
