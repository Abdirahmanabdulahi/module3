{% extends 'base.html' %}

{% block title %}Exam Management{% endblock %}

{% block content %}

<div class="row">
    <a href="#"><strong><span class="ti-crown"></span> Exams Section <i class="fa fa-pencil" aria-hidden="true"></i></strong></a>
    <hr>  
    <div class="float-right mb-2 col-md-2">
        <!-- Button to trigger the modal -->
        <button type="button" id="addExam" class="btn btn-info" title="Add exam" data-toggle="modal" data-target="#examModal">
            <i title="Add Exam" class="fa fa-plus-square" aria-hidden="true"></i> 
        </button>
    </div>
    <br><br>
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Exam Name</th>
                <th>Exam Date</th>
                <th>Subject ID</th>               
                <th>Action</th>               
            </tr>
        </thead>
        <tbody>
            {% for exam in exams %}
            <tr>
                <td>{{ exam.id }}</td>
                <td>{{ exam.exam_name }}</td>
                <td>{{ exam.exam_date }}</td>
                <td>{{ exam.subject }}</td>                     
                <td>
                    <!-- Edit button triggers the modal and pre-fills the data -->
                    <button class="btn btn-primary editExam" 
                            data-id="{{ exam.id }}" 
                            data-name="{{ exam.exam_name }}" 
                            data-date="{{ exam.exam_date }}" 
                            data-subject="{{ exam.subject_id }}">
                        <i title="Update Exam" class="fa fa-pencil-square"></i>
                    </button>
                    <a href="{{ url_for('delete_exam', id=exam.id) }}" class="btn btn-danger" 
                             onclick="return confirm('Are you sure you want to delete this records?')"> 
                        <i title="Delete Exam" class="fa fa-trash"></i>
                    </a>
                </td>
            </tr> 
            {% endfor %}    
        </tbody>
    </table>         
    <hr> 
</div>

<!-- Modal for adding/editing exams -->
<div id="examModal" class="modal fade">
    <div class="modal-dialog">
        <form method="post" id="examForm" action="{{ url_for('save_exam') }}">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title"><i title="Edit Exam" class="fa fa-plus">Update Exam</i> </h4>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="exam_name" class="control-label">Exam Name</label>
                        <input type="text" name="exam_name" id="exam_name" autocomplete="off" class="form-control" placeholder="Exam name" required/>
                    </div>
                    <div class="form-group">
                        <label for="exam_date" class="control-label">Exam Date</label>
                        <input type="date" class="form-control" id="exam_date" name="exam_date" required>
                    </div>
                    <div class="form-group">
                        <label for="subject_id" class="control-label">Subject ID</label>
                        <select class="form-control" id="subject_id" name="subject_id" required>
                            <option value="">--Select--</option>
                            {% for subject in subjects %}
                                <option value="{{ subject.subject_id }}">{{ subject.subject }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <input type="hidden" name="examid" id="examid" />
                    <input type="hidden" name="action" id="action" value="addExam" />
                    <button type="submit" class="btn btn-info" name="save" id="save"><i class="fa fa-cloud"></i> Save</button>
                    <button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-window-close"></i> Close</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    // Handle adding new exam
    document.getElementById('addExam').addEventListener('click', function() {
        document.getElementById('examForm').reset();
        document.getElementById('examModal').querySelector('.modal-title').innerText = "Add Exam";
        document.getElementById('action').value = "addExam";
    });

    // Handle editing existing exam
    document.querySelectorAll('.editExam').forEach(function(button) {
        button.addEventListener('click', function() {
            var examId = this.getAttribute('data-id');
            var examName = this.getAttribute('data-name');
            var examDate = this.getAttribute('data-date');
            var subjectId = this.getAttribute('data-subject');

            document.getElementById('examid').value = examId;
            document.getElementById('exam_name').value = examName;
            document.getElementById('exam_date').value = examDate;
            document.getElementById('subject_id').value = subjectId;

            document.getElementById('examModal').querySelector('.modal-title').innerText = "Edit Exam";
            document.getElementById('action').value = "updateExam";

            $('#examModal').modal('show');
        });
    });
</script>

{% endblock %}
