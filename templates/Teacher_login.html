
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <!-- Bootswatch Cosmo Theme -->
    <link href="https://stackpath.bootstrapcdn.com/bootswatch/4.5.2/cosmo/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    


</head>

<div class="container-fluid">
        <form action=" {{url_for('Teacher_login')}} " method="POST">
            <h3 align="center"> Welcome Teacher Login Page </h3>
        
        <div class="form-group text-center text-bold " >
            <label for="User_name">TEACHER_NAME:</label>
            <input type="text" class="form-control" id="user_name" name="User_name" placeholder="Enter Your Name" value="">
        </div>
        <div class="form-group text-center">
            <label for="password">PASSWORD:</label>
            <input type="password" class="form-control" id="password" name="user_Password" placeholder="Enter Your password" value="">
            <button type="submit" class="btn btn-primary bt-xl mt-3 mb-2"  value="Login">Login</button> 
            &nbsp;  &nbsp;  &nbsp;  &nbsp; &nbsp; 
            <button type="reset" class="btn btn-danger bt-xl mt-3 mb-2"  value="Login">Reset</button>
            {%with messages = get_flashed_messages()%}
            {%if messages %}
            {%for messages in messages %}

            
        
            <div class="alert alert-success alert-dismissable" role="alert">
                <button type="button" class="close" data-dismiss="alert" aria-label="close">
                    <span aria-hidden="true">&tilde;</span>
                </button>
                {{messages}} 
            </div>
            {%endfor%}
            {%endif %}
            {%endwith%}
           
        </div>
       
    </form>
</div>
