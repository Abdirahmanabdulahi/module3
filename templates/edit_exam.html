{% extends 'base.html' %}

{% block title %}{{ action == 'edit' ? 'Edit Exam' : 'Add Exam' }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">
                <h4>{{ action == 'edit' ? 'Edit Exam' : 'Add Exam' }}</h4>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('save_exam') }}">
                    <div class="form-group">
                        <label for="exam_name">Exam Name</label>
                        <input type="text" class="form-control" id="exam_name" name="exam_name"
                               value="{{ exam.exam_name if action == 'edit' else '' }}" required>
                    </div>
                    <div class="form-group">
                        <label for="exam_date">Exam Date</label>
                        <input type="date" class="form-control" id="exam_date" name="exam_date"
                               value="{{ exam.exam_date if action == 'edit' else '' }}" required>
                    </div>
                    <div class="form-group">
                        <label for="subject_id">Subject</label>
                        <select class="form-control" id="subject_id" name="subject_id" required>
                            <option value="">-- Select --</option>
                            {% for subject in subjects %}
                                <option value="{{ subject.subject_id }}"
                                    {% if action == 'edit' and exam.subject_id == subject.subject_id %}selected{% endif %}>
                                    {{ subject.subject }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <input type="hidden" name="examid" value="{{ exam.id if action == 'edit' else '' }}">
                    <input type="hidden" name="action" value="{{ action }}">
                    <button type="submit" class="btn btn-info">
                        {{ action == 'edit' ? 'Update' : 'Add' }} Exam
                    </button>
                    <a href="{{ url_for('exams') }}" class="btn btn-danger">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
