{% extends 'base.html' %}

{% block title %}Section Management{% endblock %}

{% block content %}
<script src="{{ url_for('static', filename='js/sections.js') }}"></script>
        <div class="row">
            <a href="#"><strong><span class="ti-crown"></span>Sections <i class="fa fa-puzzle-piece" aria-hidden="true"></i></strong></a>
            <hr>		
            <div class="panel-heading">
                <div class="row">
                    <div class="col-md-10">
                        <h3 class="panel-title"></h3>
                    </div>
                    <div class="float-right mb-2 col-md-2">
                        <button type="button" id="addSection" class="btn btn-info" title="Add Section" data-toggle="modal" data-target="#sectionModal">
                            <span class="glyphicon glyphicon-plus"></span> <i title="Add Section" class="fa fa-plus-square" aria-hidden="true"></i>
                        </button>

                    </div>
                </div>
            </div>
            <table id="sectionList" class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>											
                        <th>Action</th>
                       							
                    </tr>
                </thead>
                <tbody>
                  {% for section in sections %}
                  <tr>
                    <td>{{section.section_id}}</td>
                    <td>{{section.section}}</td>											
                    <td><a href="{{url_for('edit_sections', section_id=section.section_id)}}" id="{{section.section_id}}" class="btn btn-primary update"><i title="Update Section" class="fa fa-pencil-square" aria-hidden="true"></i></a>
                    <a href="{{url_for('delete_sections', section_id=section.section_id)}}" class="btn btn-danger"  onclick="return confirm('Are you sure you want to delete this records?')"><i title="Delete Section" class="fa fa-trash" aria-hidden="true"></i></a></td>
                  </tr> 
                  {% endfor %}	  
                </tbody>
            </table>
        </div>
    

<!-- Modal for Section -->
<div id="sectionModal" class="modal fade">
    <div class="modal-dialog">
        <form method="post" id="sectionForm" action="{{ url_for('save_sections') }}">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                    <h4 class="modal-title"><i class="fa fa-plus"></i> Add Section</h4>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="section_name" class="control-label">Section Name*</label>
                        <input type="text" class="form-control" id="section_name" name="section_name" placeholder="Section Name" required>							
                    </div>									
                </div>
                <div class="modal-footer">
                    <input type="hidden" name="sectionid" id="sectionid" />
                    <input type="hidden" name="action" id="action" value="create" />
                    <button type="submit" class="btn btn-info" name="save" id="save" data-dismiss="modal " value="save"><i title="save Data" class="fa fa-cloud" aria-hidden="true"></i></button>
                    <button type="submit" class="btn btn-danger" data-dismiss="modal"><i title="close this form" class="fa fa-window-close" aria-hidden="true"></i></button>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock %}
