{% extends 'base.html' %}

{% block title %}Class Management{% endblock %}

{% block content %}   	
			<div class="row">
				<a href="#"><strong><span class="ti-crown"></span> Classes Section <i class="fa fa-university" aria-hidden="true"></i></strong></a>
				<hr>		
				<div class="panel-heading">
					<div class="row">
						<div class="col-md-10">
							<h3 class="panel-title"></h3>
						</div>
						<div class="col-md-2" align="right">
							
							<button type="button" id="addClass" class="btn btn-info" title="Add Class" data-toggle="modal" data-target="#classModal">
								<span class="glyphicon glyphicon-plus"></span> <i title="Add Class" class="fa fa-plus-square" aria-hidden="true"></i>
						</div>
					</div>
				</div>
				<table id="classList" class="table table-bordered table-striped">
					<thead>
						<tr>
							<th>ID</th>
							<th>Name</th>	
							<th>Sections</th>
							<th>Class Teacher</th>							
							<th>Action</th>
														
						</tr>
					</thead>
					<tbody>
					  {% for class in classes %}
					  <tr>
						<td>{{class.id}}</td>
						<td>{{class.name}}</td>
						<td>{{class.section}}</td>
						<td>{{class.teacher}}</td>							
						<td><a href="{{url_for('edit_class', class_id=class.id)}}" class="btn btn-primary update"><i title="Update Class" class="fa fa-pencil-square" aria-hidden="true"></i></a>
						<a href="{{url_for('delete_class', class_id=class.id)}}" class="btn btn-danger"  onclick="return confirm('Are you sure you want to delete this records?')"><i title="Delete Class" class="fa fa-trash" aria-hidden="true"></i></a></td>
					  </tr> 
					{% endfor %}	
					</tbody>
				</table>
			</div>
		
  <div id="classModal" class="modal fade">
	<div class="modal-dialog">
		<form method="post" id="classForm" action="{{ url_for('save_class')}}">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">&times;</button>
					<h4 class="modal-title"><i class="fa fa-plus"></i> Edit Class</h4>
				</div>
				<div class="modal-body">
					<div class="form-group">
						<label for="firstname" class="control-label">Class Name*</label>
						<input type="text" class="form-control" id="cname" name="cname" placeholder="Class Name" required>					
					</div>	
					<div class="form-group">
						<label for="mname" class="control-label">Sections*</label>	
						<select name="sectionid" id="sectionid" class="form-control" required>
							<option value="">Select Section</option>
							{% for section in sections %}
								<option value="{{section.section_id}}">{{section.section}}</option>	
							{% endfor %}	 
						</select>
					</div>	
					<div class="form-group">
						<label for="mname" class="control-label">Assign Class Teacher*</label>	
						<select name="teacherid" id="teacherid" class="form-control" required>
							<option value="">--Select--</option>
							{% for teacher in teachers %}
								<option value="{{teacher.teacher_id}}">{{teacher.teacher}}</option>	
							{% endfor %}	 
						</select>
					</div>		
				</div>
				<div class="modal-footer">
					<input type="hidden" name="classid" id="classid" />
					<input type="hidden" name="action" id="action" value="" />
					<button type="submit" class="btn btn-info" name="save" id="save" data-dismiss="modal " value="save"><i title="save Data" class="fa fa-cloud" aria-hidden="true"></i></button>
                    <button type="submit" class="btn btn-danger" data-dismiss="modal"><i title="close this form" class="fa fa-window-close" aria-hidden="true"></i></button>
				</div>
			</div>
		</form>
	</div>
</div>

{% endblock  %}
