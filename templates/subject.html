{% extends 'base.html' %}

{% block title %}Teacher Management{% endblock %}

{% block content %}    	
			<div class="row">				 
				<a href="#"><strong><span class="ti-crown"></span> Subjects Section <i class="fa fa-book " aria-hidden="true"></i></strong></a>
				<hr>		
				<div class="panel-heading">
					<div class="row">
						
						<div class="float-right mb-2 col-md-2">
							
							<button type="button" id="addSubject" class="btn btn-info" title="Add Subject" data-toggle="modal" data-target="#subjectModal">
								<span class="glyphicon glyphicon-plus"></span> <i title="Add Subject" class="fa fa-plus-square" aria-hidden="true"></i>
							</button>
							
						</div>
					</div>
				</div>
				<table id="subjectList" class="table table-bordered table-striped" class="table table-striped">
					<thead>
						<tr>
							<th>ID</th>
							<th>Subject</th>	
							<th>Code</th>
							<th>Subject Type</th>							
							<th>Action</th>
												
						</tr>
					</thead>
					<tbody>
					  {% for subject in subjects %}
					  <tr>
						<td>{{subject.subject_id}}</td>
						<td>{{subject.subject}}</td>
						<td>{{subject.code}}</td>
						<td>{{subject.type}}</td>							
						<td><a href="{{url_for('edit_subject', subject_id=subject.subject_id)}}" class="btn btn-primary update"><i title="Update Subject" class="fa fa-pencil-square" aria-hidden="true"></i></a>
						<a href="{{url_for('delete_subject', subject_id=subject.subject_id)}}" class="btn btn-danger"  onclick="return confirm('Are you sure you want to delete this records?')"><i title="Delete Subject" class="fa fa-trash" aria-hidden="true"></i></a></td>
					  </tr> 
					{% endfor %}	  
					</tbody>
				</table>						
				</div>	
			
				<div id="subjectModal" class="modal fade">
					<div class="modal-dialog">
						<form method="post" id="subjectForm" action="{{ url_for('save_subject') }}">
							<div class="modal-content">
								<div class="modal-header">
									<button type="button" class="close" data-dismiss="modal">&times;</button>
									<h4 class="modal-title"><i class="fa fa-plus"></i> Add Subject</h4>
								</div>
								<div class="modal-body">
									<div class="form-group">
										<label for="subject" class="control-label">Subject*</label>
										<input type="text" class="form-control" id="subject" name="subject" placeholder="Subject Name" required>                    
									</div>    
									<div class="form-group">
										<label for="s_type" class="control-label">Subject Type</label><br>                          
										<label class="radio-inline">
											<input type="radio" name="s_type" id="theory" value="Theory" required>Theory
										</label>
										<label class="radio-inline">
											<input type="radio" name="s_type" id="practical" value="Practical" required>Practical
										</label>                           
									</div>    
									<div class="form-group">
										<label for="code" class="control-label">Code*</label>
										<input type="text" class="form-control" id="code" name="code" placeholder="code..." required>                    
									</div>
								</div>
								<div class="modal-footer">
									<input type="hidden" name="subjectid" id="subjectid" />
									<input type="hidden" name="action" id="action" value="createSubject" />
									<button type="submit" class="btn btn-info" name="save" id="save" data-dismiss="modal " value="save"><i title="save Data" class="fa fa-cloud" aria-hidden="true"></i></button>
                    <button type="submit" class="btn btn-danger" data-dismiss="modal"><i title="close this form" class="fa fa-window-close" aria-hidden="true"></i></button>
								</div>
							</div>
						</form>
					</div>
				</div>
				


{% endblock  %}
